name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - v71-probes
          - ffi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --all-targets ${{ matrix.features == 'default' && '' || format('--features {0}', matrix.features) }}
      - name: Tests
        run: cargo test -- --test-threads=1 ${{ matrix.features == 'default' && '' || format('--features {0}', matrix.features) }}
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings ${{ matrix.features == 'default' && '' || format('--features {0}', matrix.features) }}

  no-default-features:
    name: check (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Check library without default features (Android NDK path)
        run: cargo check --no-default-features

  strict:
    name: strict transport suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Strict tests
        run: cargo test -- --test-threads=1 --test strict_e2e --test ntf --test proxy
        env:
          SMP_STRICT: "1"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: fuzz smoke (mutation harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      # The in-repo harness is a deterministic seeded mutation fuzzer (no nightly/cargo-fuzz needed,
      # so it runs on every PR). It asserts that no parser panics on hostile input.
      - name: Mutation fuzz harness
        run: cargo test --offline --release --test fuzz_parse -- --nocapture

  package:
    name: package (crates.io metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Package dry run
        run: cargo package --allow-dirty --no-verify
      - name: Package contents must not include the vendored Haskell reference
        run: |
          cargo package --allow-dirty --no-verify --list > package-list.txt
          ! grep -q '^simplexmq/' package-list.txt
          ! grep -q '^spec/' package-list.txt
