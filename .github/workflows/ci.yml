name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - v71-probes
          - ffi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --locked --all-targets ${{ matrix.features == 'default' && '' || format('--features {0}', matrix.features) }}
      - name: Tests
        run: cargo test --locked ${{ matrix.features == 'default' && '' || format('--features {0}', matrix.features) }} -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features == 'default' && '' || format('--features {0}', matrix.features) }} -- -D warnings

  no-default-features:
    name: check (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Check library without default features (Android NDK path)
        run: cargo check --no-default-features

  strict:
    name: strict transport suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Strict tests
        # cargo accepts only one --test per invocation
        run: |
          cargo test --locked --test strict_e2e -- --test-threads=1
          cargo test --locked --test ntf -- --test-threads=1
          cargo test --locked --test proxy -- --test-threads=1
        env:
          SMP_STRICT: "1"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: fuzz smoke (mutation harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      # The in-repo harness is a deterministic seeded mutation fuzzer (no nightly/cargo-fuzz needed,
      # so it runs on every PR). It asserts that no parser panics on hostile input.
      - name: Mutation fuzz harness
        run: cargo test --locked --release --test fuzz_parse -- --nocapture

  package:
    name: package (crates.io metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Package dry run
        run: cargo package --allow-dirty --no-verify
      - name: Package contents must not include the vendored Haskell reference
        run: |
          cargo package --allow-dirty --no-verify --list > package-list.txt
          ! grep -q '^simplexmq/' package-list.txt
          ! grep -q '^spec/' package-list.txt

  probe-isolation:
    name: default build excludes probe binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build the default feature set
        run: cargo build
      - name: assert no probe binaries in the default build
        run: |
          for b in smp-v71 xftp-h2-v71 ntf-probe; do
            if [ -f "target/debug/$b" ]; then
              echo "probe binary $b leaked into the default build"
              exit 1
            fi
          done
          echo "OK: no probe binaries in the default build"

  ffi-smoke:
    name: ffi smoke (Kotlin calls the Rust facade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev curl unzip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin
        run: |
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlin-compiler-2.0.21/bin" >> $GITHUB_PATH
      - name: Build the cdylib and run the Kotlin smoke test
        run: bash scripts/ffi_smoke.sh

