[package]
name = "smp-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust implementation of the SimpleX Messaging Protocol (SMP) — the protocol SimpleX Chat / simplexmq servers speak"

[lib]
name = "smp_rs"
path = "src/lib.rs"

[[bin]]
name = "smp-server"
path = "src/bin/smp_server.rs"

[[bin]]
name = "smp-client"
path = "src/bin/smp_client.rs"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
xsalsa20poly1305 = "0.9"
aead = "0.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

[profile.release]
opt-level = 2
