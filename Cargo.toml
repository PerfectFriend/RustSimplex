[package]
name = "smp-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust implementation of the SimpleX Messaging Protocol (SMP) — server engine + client"

[lib]
name = "smp_rs"
path = "src/lib.rs"

[[bin]]
name = "smp-server"
path = "src/bin/smp_server.rs"

[[bin]]
name = "smp-client"
path = "src/bin/smp_client.rs"

[[bin]]
name = "xftp-h2"
path = "src/bin/xftp_h2.rs"

[[bin]]
name = "xftp-h2-v71"
path = "src/bin/xftp_h2_v71.rs"

[[bin]]
name = "smp-v71"
path = "src/bin/smp_v71.rs"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
xsalsa20poly1305 = "0.9"
aead = "0.5"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std"] }
rustls-webpki = "0.103"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
tokio-rustls = "0.26"
h2 = "0.4"
http = "1"
bytes = "1"
futures = "0.3"
sha3 = "0.10"
sntrup761 = "0.4"
openssl = "0.10.82"
tokio-openssl = "0.6.5"

[profile.release]
opt-level = 2
